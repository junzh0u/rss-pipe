services:
  rss-pipe:
    image: ghcr.io/junzh0u/rss-pipe:latest
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    volumes:
      - ./downloaded:/app/downloaded
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec rss-pipe -d /app/downloaded -p ${PORT:-4000} -r ${RETENTION_DAYS:-30} -c ${CACHE_TTL_MINUTES:-10} ${BASE_URL:+-b "$BASE_URL"}
    restart: unless-stopped
